[project]
name = "sandcage"
version = "0.1.0"
description = "A containment-first harness for AI coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "hypothesis==6.170.14",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "types-pyyaml==6.0.12.20261103",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandcage"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The demo repo is target code for the agent (with a deliberate bug), not ours to lint.
extend-exclude = ["demo-repos"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "RET",
    "PT", "N", "PTH", "TID", "PL", "BLE", "S",
]
ignore = [
    "PLR2004",  # magic values are fine in tests and rule tables
    "PLR0911",  # small decision functions return early by design
    "PLR0912",
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "PLC0415"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Docker-marked tests need a daemon and the sandbox image: `make test-docker` runs them.
addopts = "-q --strict-markers --strict-config -m 'not docker'"
markers = ["docker: needs a running Docker daemon and the sandbox image (make test-docker)"]
xfail_strict = true
